- name: Configure web server
  hosts: web
  tasks:
    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Copy website file
      copy:
        src: files/index.html
        dest: /var/www/html/index.html

    - name: Start nginx
      command: nginx
      args:
        creates: /run/nginx.pid
